name: CI

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"

# Jobs run on the in-org runner. Pull requests from forks are skipped so
# untrusted code never runs there.
jobs:
  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - default
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install utils
        run: sudo apt-get update && sudo apt-get install -qy curl make git

      - name: Lint
        run: make lint
  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - default
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install utils
        run: sudo apt-get update && sudo apt-get install -qy curl make git

      - name: Build
        run: make build

      - name: Bin
        uses: actions/upload-artifact@v7
        with:
          name: hyper-proxy
          path: ./bin/hyper-proxy

  test:
    name: Test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - default
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # -race needs cgo, so a C compiler.
      - name: Install utils
        run: sudo apt-get update && sudo apt-get install -qy gcc libc6-dev

      - name: Test
        run: go test -race ./...
